name: images
on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/images.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix: { image: [qkd-exchange, strongswan, macsec] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:0.1.0
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:sha-${{ github.sha }}
