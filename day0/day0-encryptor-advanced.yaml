#cloud-config
# ADVANCED Day 0, Network Edge profile "k3s-node": a QKD encryptor (IPsec, MACsec, SSH key rotation) with per-site values; simulated laptops on the default subnets.
# Equinix inline placeholders, case-sensitive. KME_URL empty = linked lab simulators; https:// = mutual TLS.
# Required: QKD_ROLE IKE_PSK REGISTRY_USER REGISTRY_TOKEN; master also FQDN ADMIN_EMAIL. README.

hostname: [(${hostname})]
manage_etc_hosts: true
preserve_hostname: false

# users: [] stops cloud-init adding its default user (the bootstrap creates it).
users: []

ssh_pwauth: false

ntp:
  enabled: true
  ntp_client: chrony
  servers:
    - 0.pool.ntp.org
    - 1.pool.ntp.org

write_files:
  # Static network; sorts before cloud-init's DHCP file.
  - path: /etc/systemd/network/05-equinix.network
    owner: root:root
    permissions: "0644"
    content: |
      [Match]
      Name=ens3

      [Network]
      Address=[(${ipAddressWithCidr})]
      Gateway=[(${gateway})]
      DNS=8.8.8.8
      DNS=8.8.4.4

  - path: /etc/day0/params.env
    owner: root:root
    permissions: "0600"
    content: |
      USER_NAME='[(${userName})]'
      PUBLIC_KEY='[(${publicKey})]'
      ADMIN_PWD='[(${adminPwd})]'
      ADMIN_PASSWORD='[(${adminPassword})]'
      K3S_ROLE='[(${K3S_ROLE})]'
      K3S_SERVER_URL='[(${K3S_SERVER_URL})]'
      K3S_TOKEN='[(${K3S_TOKEN})]'
      K3S_TLS_SAN='[(${K3S_TLS_SAN})]'

      SAE_ID='[(${SAE_ID})]'
      PEER_SAE_ID='[(${PEER_SAE_ID})]'
      QKD_ROLE='[(${QKD_ROLE})]'
      KME_URL='[(${KME_URL})]'
      PEER_ADDR='[(${PEER_ADDR})]'
      IKE_PSK='[(${IKE_PSK})]'
      LOCAL_TS='[(${LOCAL_TS})]'
      REMOTE_TS='[(${REMOTE_TS})]'
      MACSEC_IFACE='[(${MACSEC_IFACE})]'
      MACSEC_ADDR='[(${MACSEC_ADDR})]'
      LOCAL_ADDR='[(${LOCAL_ADDR})]'
      KME_ADDR='[(${KME_ADDR})]'
      K3S_PRIVATE_IFACE='[(${K3S_PRIVATE_IFACE})]'
      K3S_PRIVATE_IP_CIDR='[(${K3S_PRIVATE_IP_CIDR})]'
      REGISTRY_USER='[(${REGISTRY_USER})]'
      REGISTRY_TOKEN='[(${REGISTRY_TOKEN})]'
      FQDN='[(${FQDN})]'
      ADMIN_EMAIL='[(${ADMIN_EMAIL})]'
      ADMIN_PASSWORD='[(${ADMIN_PASSWORD})]'

  - path: /usr/local/bin/day0-encryptor.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Called by day0-bootstrap.sh with the QKD/site parameters in the environment.
      set -euo pipefail
      K="/usr/local/bin/k3s kubectl"
      MAN=/var/lib/rancher/k3s/server/manifests
      NS=encryptor
      for v in QKD_ROLE IKE_PSK REGISTRY_USER REGISTRY_TOKEN; do
        [ -n "${!v:-}" ] || { echo "missing required parameter $v"; exit 1; }
      done
      # no KME_URL: one lab simulator per appliance, linked
      INSTALL_KME_SIM=no
      if [ -z "${KME_URL:-}" ]; then
        case "$QKD_ROLE" in master) D1=11; D2=12 ;; *) D1=12; D2=11 ;; esac
        KME_ADDR="${KME_ADDR:-192.168.50.$D1}"   # ens6: KME channel
        kme_peer() { printf '%s' "$1" | awk -F. -v d="$2" '{print $1"."$2"."$3"."$4+d}'; }   # the other side: next address on the master, previous on the slave
        case "$QKD_ROLE" in master) KME_PEER_ADDR=$(kme_peer "$KME_ADDR" 1) ;; *) KME_PEER_ADDR=$(kme_peer "$KME_ADDR" -1) ;; esac
        KME_URL="http://$KME_ADDR:8443"; INSTALL_KME_SIM=yes
      fi
      if [ "$QKD_ROLE" = master ]; then
        for v in FQDN ADMIN_EMAIL; do
          [ -n "${!v:-}" ] || { echo "missing required parameter $v (the master console is served at https://FQDN)"; exit 1; }
        done
        FQDN="$(printf '%s' "$FQDN" | tr 'A-Z' 'a-z')"
      fi
      case "$QKD_ROLE" in master) PEER_ROLE=slave ;; slave) PEER_ROLE=master ;; *) echo "QKD_ROLE must be master|slave"; exit 1 ;; esac
      # SAE IDs default by role (SAE-A master, SAE-B slave); set both to the names your KME knows
      case "$QKD_ROLE" in master) A=SAE-A; B=SAE-B ;; *) A=SAE-B; B=SAE-A ;; esac
      SAE_ID="${SAE_ID:-$A}"; PEER_SAE_ID="${PEER_SAE_ID:-$B}"
      # protected subnets behind each appliance (traffic on a directly attached subnet stays outside the tunnel)
      case "$QKD_ROLE" in master) A=10.1.0.0/24; B=10.2.0.0/24 ;; *) A=10.2.0.0/24; B=10.1.0.0/24 ;; esac
      LAB=""; [ -n "${LOCAL_TS:-}${REMOTE_TS:-}" ] || LAB=yes   # laptops only with the default subnets: never shadow a real one
      LOCAL_TS="${LOCAL_TS:-$A}"; REMOTE_TS="${REMOTE_TS:-$B}"
      # simulated laptop at .10 of each protected subnet
      LAPTOP_IP=""; PEER_LAPTOP_IP=""; LAPTOP_MASK=""
      if [ -n "$LAB" ]; then
        host10() { printf '%s' "${1%/*}" | awk -F. '{print $1"."$2"."$3".10"}'; }
        LAPTOP_IP="$(host10 "$LOCAL_TS")"; PEER_LAPTOP_IP="$(host10 "$REMOTE_TS")"; LAPTOP_MASK="${LOCAL_TS#*/}"
      fi
      # encryptor link on ens5: .11 master, .12 slave (set both for sites linked another way)
      case "$QKD_ROLE" in master) A=172.16.0.11; B=172.16.0.12 ;; *) A=172.16.0.12; B=172.16.0.11 ;; esac
      LOCAL_ADDR="${LOCAL_ADDR:-$A}"; PEER_ADDR="${PEER_ADDR:-$B}"
      NODE_IP="${LOCAL_ADDR:-$(ip -4 route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1)}')}"
      BIND=""; [ -n "${LOCAL_ADDR:-}" ] && BIND=',"bind":"'"$LOCAL_ADDR"'"'
      # console on cni0: only Traefik reaches it
      PODCIDR="$($K get node -o jsonpath='{.items[0].spec.podCIDR}' 2>/dev/null || true)"
      CONSOLE_IP="$(printf '%s' "${PODCIDR:-10.42.0.0/24}" | cut -d/ -f1 | awk -F. '{print $1"."$2"."$3"."$4+1}')"
      # --- network files, kept across reboots (scripts/network.sh)
      LOCAL_ADDR="${LOCAL_ADDR:-}" KME_ADDR="${KME_ADDR:-}" MACSEC_IFACE="${MACSEC_IFACE:-}" LAPTOP_IP="${LAPTOP_IP:-}" LAPTOP_MASK="${LAPTOP_MASK:-}" \
        /usr/local/bin/day0-network.sh || echo "WARNING: network files not applied: set the NIC addresses by hand"
      if [ -n "${LOCAL_ADDR:-}" ] && ! ip -4 -o addr show | grep -qw "$LOCAL_ADDR"; then echo "WARNING: LOCAL_ADDR $LOCAL_ADDR is not set on any interface; the peer API and IPsec wait until it exists"; fi

      W="$(mktemp -d)"; trap 'rm -rf "$W"' EXIT
      # https:// = mutual TLS; certificates are loaded after boot into Secret kme-tls (README)
      SIMJ=""; [ "$INSTALL_KME_SIM" = yes ] && SIMJ=',"sim":true'
      case "$KME_URL" in
        https://*) SCHEME=https; TLSJ='"ca":"/etc/qkd/tls/ca.crt","cert":"/etc/qkd/tls/tls.crt","key":"/etc/qkd/tls/tls.key"' ;;
        *)         SCHEME=http;  TLSJ='"ca":null'; echo "KME_URL is not https: KME and peer API use plain HTTP (lab only)" ;;
      esac

      LAPTOP=""; [ -z "$LAB" ] || LAPTOP='"laptop":{"addr":"'"$LAPTOP_IP"'","peer":"'"$PEER_LAPTOP_IP"'","port":7,"local_ts":"'"$LOCAL_TS"'","remote_ts":"'"$REMOTE_TS"'"},'
      CONSOLE=""; [ "$QKD_ROLE" = master ] && CONSOLE='"console":{"bind":"'"$CONSOLE_IP"'","port":8080,"hosts":["'"$FQDN"'"],"auth_file":"/etc/qkd/auth/auth"},'

      # --- exchange config: three consumers, same role on all of them
      INT=3600
      cat > "$W/config.json" <<EOF
      {"sae_id":"$SAE_ID",
       "kme":{"url":"$KME_URL",$TLSJ$SIMJ},
       "peer":{"url":"$SCHEME://$PEER_ADDR:8444","listen":8444$BIND,$TLSJ},
       $CONSOLE
       $LAPTOP
       "consumers":[
        {"name":"s2s","type":"ipsec","peer_sae":"$PEER_SAE_ID","role":"$QKD_ROLE","interval":$INT,"dir":"/swanctl/conf.d"},
        {"name":"macsec","type":"macsec","peer_sae":"$PEER_SAE_ID","role":"$QKD_ROLE","interval":86400,"dir":"/macsec"},
        {"name":"ssh","type":"ssh","peer_sae":"$PEER_SAE_ID","role":"$QKD_ROLE","interval":86400,"dir":"/ssh"}]}
      EOF

      # --- macsec settings read by the macsec container
      printf 'MACSEC_IFACE=%s\nMACSEC_ADDR=%s\n' "${MACSEC_IFACE:-}" "${MACSEC_ADDR:-}" > "$W/macsec.env"

      # --- swanctl: IKEv2 + PPK required (no silent downgrade to a non-QKD tunnel)
      START=none; [ "$QKD_ROLE" = master ] && START=start
      cat > "$W/swanctl.conf" <<EOF
      include conf.d/*.conf
      connections {
        s2s {
          version = 2
          mobike = no                    # stay on LOCAL_ADDR/PEER_ADDR: no migration to the public addresses
          local_addrs = $NODE_IP
          remote_addrs = $PEER_ADDR
          proposals = aes256gcm16-prfsha384-x25519
          reauth_time = 1h
          keyingtries = 0
          ppk_id = qkd-s2s
          ppk_required = yes
          local {
            auth = psk
            id = $SAE_ID
          }
          remote {
            auth = psk
            id = $PEER_SAE_ID
          }
          children {
            s2s {
              local_ts = $LOCAL_TS
              remote_ts = $REMOTE_TS
              esp_proposals = aes256gcm16-x25519
              rekey_time = 30m
              start_action = $START
            }
          }
        }
      }
      secrets {
        ike-peer {
          id-1 = $SAE_ID
          id-2 = $PEER_SAE_ID
          secret = "${IKE_PSK:-}"
        }
      }
      EOF

      $K create namespace $NS --dry-run=client -o yaml | $K apply -f -
      $K -n $NS create configmap site --from-file=config.json="$W/config.json" --from-file=macsec.env="$W/macsec.env" \
        --dry-run=client -o yaml | $K apply -f -
      $K -n $NS create secret generic site-secrets --from-file=swanctl.conf="$W/swanctl.conf" --dry-run=client -o yaml | $K apply -f -

      fetch() {   # fetch <file in repo>
        for i in 1 2 3 4 5 6; do
          curl -fsSL --retry 3 -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/equinix-svc/svc-helm-encryptor/contents/$1" -o "$MAN/$1" && break
          echo "download of $1 failed (try $i), retrying"; sleep 20
        done
        [ -s "$MAN/$1" ] || { echo "could not download $1"; exit 1; }
        echo "$1 installed in $MAN"
      }
      EXTRA=""; [ "${INSTALL_KME_SIM:-}" = yes ] && EXTRA=dev-kme-sim.yaml
      for f in encryptor.yaml $EXTRA; do fetch "$f"; done
      # simulator: bind to the KME channel, pull keys from the other one
      if [ -n "$EXTRA" ]; then
        SIMARGS="sim, --bind, \"$KME_ADDR\""
        sed -i "s#args: \[sim, --port, \"8443\"\]#args: [$SIMARGS, --peer, \"http://$KME_PEER_ADDR:8443\", --port, \"8443\"]#" "$MAN/dev-kme-sim.yaml"
      fi
      # Login banner (best effort: never stops the install)
      curl -fsSL --retry 3 -H "Accept: application/vnd.github.raw" \
        "https://api.github.com/repos/equinix-svc/svc-helm-encryptor/contents/scripts/motd.sh" -o /etc/profile.d/qkd-encryptor-motd.sh \
        && chmod 0644 /etc/profile.d/qkd-encryptor-motd.sh && echo "login banner installed" || echo "login banner not installed (non-fatal)"
      # Master console at https://FQDN (login and Let's Encrypt certificate)
      if [ "$QKD_ROLE" = master ]; then
        curl -fsSL --retry 3 -H "Accept: application/vnd.github.raw" \
          "https://api.github.com/repos/equinix-svc/svc-helm-encryptor/contents/scripts/console-setup.sh" -o /usr/local/bin/day0-console.sh \
          && K="$K" MAN="$MAN" NODE_IP="$CONSOLE_IP" FQDN="$FQDN" ADMIN_EMAIL="$ADMIN_EMAIL" ADMIN_PASSWORD="${ADMIN_PASSWORD:-}" bash /usr/local/bin/day0-console.sh \
          || { echo "console setup failed (see above)"; exit 1; }
      fi

  - path: /usr/local/bin/day0-bootstrap.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # First-boot k3s bootstrap. Idempotent: does nothing once /var/log/day0-done exists.
      set -euo pipefail
      exec >>/var/log/day0.log 2>&1
      echo "[$(date -Is)] day0-bootstrap start"

      [ -e /var/log/day0-done ] && { echo "already done"; exit 0; }
      . /etc/day0/params.env

      echo "network at start:"; ip -br a; ip r

      # User: the portal user (userName). The key comes from publicKey (may lack the key
      # type); the portal password hash is set on the user.
      norm_key() {
        case "$1" in
          ssh-*|ecdsa-*|sk-*)    echo "$1" ;;
          AAAAB3NzaC1yc2*)       echo "ssh-rsa $1" ;;
          AAAAC3NzaC1lZDI1NTE5*) echo "ssh-ed25519 $1" ;;
          *)                     echo "$1" ;;
        esac
      }
      # adminPwd or adminPassword: whichever is a hash, else plain text; never concatenated
      is_hash() { case "$1" in '$1$'*|'$5$'*|'$6$'*|'$y$'*|'$2'*) return 0 ;; *) return 1 ;; esac; }
      PWD_HASH=""; PWD_PLAIN=""
      if is_hash "$ADMIN_PWD"; then PWD_HASH="$ADMIN_PWD"
      elif is_hash "$ADMIN_PASSWORD"; then PWD_HASH="$ADMIN_PASSWORD"
      elif [ -n "$ADMIN_PASSWORD" ]; then PWD_PLAIN="$ADMIN_PASSWORD"
      elif [ -n "$ADMIN_PWD" ]; then PWD_PLAIN="$ADMIN_PWD"
      fi
      setup_user() {
        local u="$1" h g k
        if ! id "$u" >/dev/null 2>&1; then
          useradd -m -s /bin/bash "$u"
          echo "$u ALL=(ALL) NOPASSWD:ALL" > "/etc/sudoers.d/90-$u"; chmod 0440 "/etc/sudoers.d/90-$u"
        fi
        h="$(getent passwd "$u" | cut -d: -f6)"; g="$(id -gn "$u")"
        if [ -n "$PWD_HASH" ]; then usermod -p "$PWD_HASH" "$u"
        elif [ -n "$PWD_PLAIN" ]; then echo "$u:$PWD_PLAIN" | chpasswd
        fi
        install -d -o "$u" -g "$g" -m 0700 "$h/.ssh"
        if [ -n "$PUBLIC_KEY" ]; then norm_key "$PUBLIC_KEY" >> "$h/.ssh/authorized_keys"; fi
        if [ -f "$h/.ssh/authorized_keys" ]; then
          sort -u "$h/.ssh/authorized_keys" -o "$h/.ssh/authorized_keys"
          chown "$u:$g" "$h/.ssh/authorized_keys"; chmod 0600 "$h/.ssh/authorized_keys"
        fi
      }
      if [ -n "$USER_NAME" ]; then
        setup_user "$USER_NAME" || echo "could not set up user $USER_NAME"
      else
        echo "userName is empty: no account created"
      fi

      # non-secret diagnostic for the login prompt
      PWD_MODE=none; if [ -n "$PWD_HASH" ]; then PWD_MODE=hash; elif [ -n "$PWD_PLAIN" ]; then PWD_MODE=plain; fi
      A_HEAD=n/a; if is_hash "$ADMIN_PWD"; then A_HEAD="${ADMIN_PWD:0:3}"; fi
      B_HASH=no; if is_hash "$ADMIN_PASSWORD"; then B_HASH=yes; fi
      DIAG="DAY0-DIAG user=[$USER_NAME] pubkey_len=${#PUBLIC_KEY} pubkey_head=${PUBLIC_KEY:0:14} adminPwd_len=${#ADMIN_PWD} head=$A_HEAD adminPassword_len=${#ADMIN_PASSWORD} is_hash=$B_HASH pwd_mode=$PWD_MODE"
      echo "$DIAG"
      echo "$DIAG" >> /etc/issue
      echo "$DIAG" > /dev/console || true

      ROLE="$K3S_ROLE"; [ -n "$ROLE" ] || ROLE=single
      for i in $(seq 60); do ip -4 route get 1.1.1.1 >/dev/null 2>&1 && break; sleep 1; done   # ens3 may still be reconfiguring
      NODE_IP="$(ip -4 route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1)}')" || { echo "ERROR: no default route after 60 s"; exit 1; }

      # private path between nodes on ens4: 10.250.<3rd>.<4th>/16 from the public IP; k3s node-ip
      PRIV_IF="${K3S_PRIVATE_IFACE:-ens4}"; PRIV_IP=""
      PRIV_CIDR="$K3S_PRIVATE_IP_CIDR"
      if [ -z "$PRIV_CIDR" ] && [ -n "$NODE_IP" ]; then PRIV_CIDR="10.250.$(echo "$NODE_IP" | cut -d. -f3).$(echo "$NODE_IP" | cut -d. -f4)/16"; fi
      [ "$PRIV_CIDR" != none ] || PRIV_CIDR=""
      if [ -n "$PRIV_CIDR" ] && ! ip link show "$PRIV_IF" >/dev/null 2>&1; then echo "private path skipped: no interface $PRIV_IF"; PRIV_CIDR=""; fi
      if [ -n "$PRIV_CIDR" ]; then
        PRIV_IP="${PRIV_CIDR%/*}"
        printf '[Match]\nName=%s\n\n[Network]\nAddress=%s\nConfigureWithoutCarrier=yes\nLinkLocalAddressing=no\nIPv6AcceptRA=no\n' \
          "$PRIV_IF" "$PRIV_CIDR" > /etc/systemd/network/10-private.network
        networkctl reload; networkctl reconfigure "$PRIV_IF" || true
        echo "private path: $PRIV_CIDR on $PRIV_IF"
      fi

      mkdir -p /etc/rancher/k3s
      CFG=/etc/rancher/k3s/config.yaml
      : > "$CFG"; chmod 0600 "$CFG"
      [ -n "${PRIV_IP:-$NODE_IP}" ] && echo "node-ip: ${PRIV_IP:-$NODE_IP}" >> "$CFG"
      curl -fsSL --retry 3 -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/equinix-svc/svc-helm-encryptor/contents/scripts/network.sh" -o /usr/local/bin/day0-network.sh && chmod 0755 /usr/local/bin/day0-network.sh || echo "network script not downloaded"
      [ -n "$K3S_TOKEN" ] && echo "token: \"$K3S_TOKEN\"" >> "$CFG"

      case "$ROLE" in
        single)
          echo "write-kubeconfig-mode: \"0640\"" >> "$CFG"
          [ -n "$K3S_TLS_SAN" ] && printf 'tls-san:\n  - "%s"\n' "$K3S_TLS_SAN" >> "$CFG"
          UNIT=k3s ;;
        server)
          echo "write-kubeconfig-mode: \"0640\"" >> "$CFG"
          [ -n "$K3S_TLS_SAN" ] && printf 'tls-san:\n  - "%s"\n' "$K3S_TLS_SAN" >> "$CFG"
          if [ -n "$K3S_SERVER_URL" ]; then echo "server: \"$K3S_SERVER_URL\"" >> "$CFG"; else echo "cluster-init: true" >> "$CFG"; fi
          UNIT=k3s ;;
        agent)
          [ -n "$K3S_SERVER_URL" ] && [ -n "$K3S_TOKEN" ] || { echo "agent needs K3S_SERVER_URL and K3S_TOKEN"; exit 1; }
          echo "server: \"$K3S_SERVER_URL\"" >> "$CFG"
          UNIT=k3s-agent ;;
        *) echo "unknown K3S_ROLE: $ROLE"; exit 1 ;;
      esac

      # ghcr.io pull credentials, read by k3s at start
      if [ -n "$REGISTRY_TOKEN" ]; then
        ( umask 077; cat > /etc/rancher/k3s/registries.yaml <<EOF
      configs:
        "ghcr.io":
          auth:
            username: "$REGISTRY_USER"
            password: "$REGISTRY_TOKEN"
      EOF
        )
        echo "registry credentials for ghcr.io written"
      else
        echo "WARNING: REGISTRY_TOKEN is empty: the encryptor install will stop (registry credentials are required)"
      fi

      systemctl daemon-reload
      systemctl enable --now "$UNIT"

      if [ "$UNIT" = k3s ]; then
        for i in $(seq 1 60); do
          /usr/local/bin/k3s kubectl get nodes 2>/dev/null | grep -qw Ready && break
          sleep 5
        done
        /usr/local/bin/k3s kubectl get nodes -o wide || true
        # make kubectl usable for the portal user
        for u in "$USER_NAME"; do
          if [ -n "$u" ] && id "$u" >/dev/null 2>&1; then
            uh="$(getent passwd "$u" | cut -d: -f6)"; ug="$(id -gn "$u")"
            install -d -o "$u" -g "$ug" -m 0700 "$uh/.kube"
            install -o "$u" -g "$ug" -m 0600 /etc/rancher/k3s/k3s.yaml "$uh/.kube/config"
          fi
        done
      fi

      # Encryptor stack: single node or first server only
      if [ "$UNIT" = k3s ] && [ -z "$K3S_SERVER_URL" ]; then
        echo "installing the encryptor stack"
        SAE_ID="$SAE_ID" PEER_SAE_ID="$PEER_SAE_ID" QKD_ROLE="$QKD_ROLE" KME_URL="$KME_URL" PEER_ADDR="$PEER_ADDR" \
        IKE_PSK="$IKE_PSK" LOCAL_ADDR="$LOCAL_ADDR" KME_ADDR="$KME_ADDR" REGISTRY_USER="$REGISTRY_USER" REGISTRY_TOKEN="$REGISTRY_TOKEN" \
        FQDN="$FQDN" ADMIN_EMAIL="$ADMIN_EMAIL" ADMIN_PASSWORD="$ADMIN_PASSWORD" \
        LOCAL_TS="$LOCAL_TS" REMOTE_TS="$REMOTE_TS" MACSEC_IFACE="$MACSEC_IFACE" MACSEC_ADDR="$MACSEC_ADDR" \
        /usr/local/bin/day0-encryptor.sh \
          || echo "encryptor install failed: see this log"
      fi

      # secrets must not linger in the clear after the unit has consumed them
      shred -u /etc/day0/params.env 2>/dev/null || rm -f /etc/day0/params.env
      date -Is > /var/log/day0-done
      echo "[$(date -Is)] day0-bootstrap done (role=$ROLE)"

runcmd:
  # apply the static network, then bootstrap
  - [ sh, -c, "networkctl reload; networkctl reconfigure ens3 || systemctl restart systemd-networkd" ]
  - [ /usr/local/bin/day0-bootstrap.sh ]
