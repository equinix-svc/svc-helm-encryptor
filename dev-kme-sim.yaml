# LAB ONLY: ETSI 014 KME simulator (random in-memory keys, no QKD, no TLS). Use as KME_URL=http://kme-sim.encryptor.svc:8443
# only when both appliances share one cluster; otherwise run it anywhere reachable: python3 agent.py sim --port 8443
apiVersion: apps/v1
kind: Deployment
metadata: { name: kme-sim, namespace: encryptor }
spec:
  replicas: 1
  selector: { matchLabels: { app: kme-sim } }
  template:
    metadata: { labels: { app: kme-sim } }
    spec:
      containers:
        - name: kme-sim
          image: ghcr.io/equinix-svc/svc-helm-encryptor/qkd-agent:0.1.0
          args: [sim, --port, "8443"]
          ports: [{ containerPort: 8443 }]
---
apiVersion: v1
kind: Service
metadata: { name: kme-sim, namespace: encryptor }
spec: { selector: { app: kme-sim }, ports: [{ port: 8443 }] }
