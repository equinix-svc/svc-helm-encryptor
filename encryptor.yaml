# QKD-keyed encryptor appliance for a single k3s node. Source template: scripts/build.py turns it into encryptor.yaml.
# One Pod (hostNetwork) with three consumers of ETSI GS QKD 014 keys, fed by qkd-exchange:
#   strongswan : IPsec IKEv2 tunnels, QKD key injected as RFC 8784 PPK
#   macsec     : MACsec (IEEE 802.1AE) on a host NIC, QKD key as MKA CAK (wpa_supplicant)
#   qkd-exchange  : KME client + peer API; also rotates SSH key pairs (written under /var/lib/encryptor/ssh)
# Site-specific Secret/ConfigMap (site, site-secrets) are NOT in this file: Day 0 creates them. The KME client
# certificates (Secret kme-tls) are loaded after boot, never through Day 0 (see README.md).
apiVersion: v1
kind: Namespace
metadata:
  name: encryptor
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: encryptor, namespace: encryptor }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: encryptor } }
  template:
    metadata: { labels: { app: encryptor } }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: strongswan
          image: ghcr.io/equinix-svc/svc-helm-encryptor/strongswan:0.1.0
          securityContext: { capabilities: { add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE] } }
          volumeMounts:
            - { name: swanctl-main, mountPath: /etc/swanctl/swanctl.conf, subPath: swanctl.conf, readOnly: true }
            - { name: swanctl-conf-d, mountPath: /etc/swanctl/conf.d }
            - { name: runstate, mountPath: /state }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
        - name: macsec
          image: ghcr.io/equinix-svc/svc-helm-encryptor/macsec:0.1.0
          securityContext: { capabilities: { add: [NET_ADMIN, NET_RAW] } }
          volumeMounts:
            - { name: site, mountPath: /etc/macsec/macsec.env, subPath: macsec.env, readOnly: true }
            - { name: macsec, mountPath: /macsec, readOnly: true }
            - { name: runstate, mountPath: /state }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
        - name: qkd-exchange
          image: ghcr.io/equinix-svc/svc-helm-encryptor/qkd-exchange:0.1.0
          securityContext: { runAsUser: 0 }    # writes files shared with the root-owned containers above
          ports: [{ containerPort: 8444, hostPort: 8444 }]
          livenessProbe: { httpGet: { host: 127.0.0.1, port: 8445, path: /healthz }, periodSeconds: 30, failureThreshold: 3 }
          volumeMounts:
            - { name: site, mountPath: /etc/qkd/config.json, subPath: config.json, readOnly: true }
            - { name: kme-tls, mountPath: /etc/qkd/tls, readOnly: true }
            - { name: console-auth, mountPath: /etc/qkd/auth, readOnly: true }
            - { name: swanctl-conf-d, mountPath: /swanctl/conf.d }
            - { name: macsec, mountPath: /macsec }
            - { name: ssh, mountPath: /ssh }
            - { name: runstate, mountPath: /state, readOnly: true }
            - { name: persist, mountPath: /persist }
          resources: { requests: { cpu: 20m, memory: 48Mi }, limits: { memory: 128Mi } }
      volumes:
        - { name: site, configMap: { name: site } }
        - { name: kme-tls, secret: { secretName: kme-tls, optional: true, defaultMode: 0400 } }
        - { name: console-auth, secret: { secretName: console-auth, optional: true, defaultMode: 0400 } }   # master only: the console login
        - name: swanctl-main
          secret: { secretName: site-secrets, items: [{ key: swanctl.conf, path: swanctl.conf }], defaultMode: 0400 }
        - { name: swanctl-conf-d, emptyDir: { medium: Memory } }     # QKD keys stay in RAM, never on disk
        - { name: macsec, emptyDir: { medium: Memory } }
        - { name: ssh, hostPath: { path: /var/lib/encryptor/ssh, type: DirectoryOrCreate } }
        - { name: runstate, emptyDir: { medium: Memory } }     # tunnel and interface state published for the console
        - { name: persist, hostPath: { path: /var/lib/encryptor/state, type: DirectoryOrCreate } }
